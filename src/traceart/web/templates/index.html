<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TraceArt</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body>
  <header>
    <div>
      <h1><a href="/">TraceArt</a></h1>
      <p class="tagline">GPX → carte dessinée minimaliste</p>
    </div>
    <nav><a href="/data" class="tool-link">⚙ données de fond</a></nav>
  </header>

  <main>
    <div class="atelier">
      <div class="rail" id="workspace">
        {% include "_uploaded.html" if files else "_empty_workspace.html" %}
      </div>

      <div class="canvas">
        <div class="canvas-frame" id="preview" aria-live="polite">
          <p class="canvas-empty">Le poster apparaît ici, dès l'envoi d'un GPX.</p>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <a href="https://github.com" rel="noopener">TraceArt</a>
    · HTMX sous licence <a href="https://unpkg.com/htmx.org/LICENSE" rel="noopener">0BSD</a>
  </footer>
</body>
</html>
