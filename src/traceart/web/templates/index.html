<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TraceArt</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body>
  <header>
    <h1>TraceArt</h1>
    <p class="tagline">GPX → carte dessinée minimaliste</p>
  </header>

  <main>
    <section id="upload-section" class="card">
      <h2>1. Trace GPS</h2>
      <form
        hx-post="/upload"
        hx-target="#workspace"
        hx-swap="innerHTML"
        hx-encoding="multipart/form-data"
      >
        <input type="file" name="files" accept=".gpx" multiple required>
        <button type="submit">Envoyer</button>
      </form>
    </section>

    <div id="workspace">
      {% include "_uploaded.html" if files else "_empty_workspace.html" %}
    </div>

    <section id="preview" class="card" aria-live="polite"></section>
  </main>

  <footer>
    <a href="/data">données de fond</a>
    · <a href="https://github.com" rel="noopener">TraceArt</a>
    · HTMX sous licence <a href="https://unpkg.com/htmx.org/LICENSE" rel="noopener">0BSD</a>
  </footer>
</body>
</html>
