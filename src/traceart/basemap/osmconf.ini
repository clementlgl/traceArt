; Configuration du pilote OSM de GDAL, propre à TraceArt.
;
; Le défaut de GDAL n'expose ni `boundary` ni `admin_level` sur la couche
; `lines` : ces tags finissent dans le HSTORE `other_tags`, qu'il faudrait
; alors parser à la main. On les déclare donc en colonnes.
;
; Les listes d'attributs sont volontairement courtes : chaque colonne
; déclarée est matérialisée pour toutes les entités de l'extrait, ce qui
; se paie en temps d'import et en mémoire.

[general]
closed_ways_are_polygons=boundary,landuse,natural,waterway,place,leisure

[points]
osm_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no
attributes=name,place,population
ignore=created_by,converted_by,source,time,ele,note,todo,openGeoDB:,fixme,FIXME

[lines]
osm_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no
attributes=name,highway,waterway,natural,boundary,admin_level
ignore=created_by,converted_by,source,time,ele,note,todo,openGeoDB:,fixme,FIXME

[multipolygons]
osm_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no
attributes=name,type,natural,landuse,water,waterway,boundary,admin_level
ignore=area,created_by,converted_by,source,time,ele,note,todo,openGeoDB:,fixme,FIXME

[multilinestrings]
osm_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no
attributes=name,type
ignore=area,created_by,converted_by,source,time,ele,note,todo,openGeoDB:,fixme,FIXME

[other_relations]
osm_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no
attributes=name,type
ignore=area,created_by,converted_by,source,time,ele,note,todo,openGeoDB:,fixme,FIXME
