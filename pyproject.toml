[project]
name = "traceart"
version = "0.2.0"
description = "Transforme un GPX en carte dessinee minimaliste (SVG/PNG)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "lxml>=5.2",
    "numpy>=2.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "click>=8.1",
    "rich>=13.7",
]

[project.optional-dependencies]
png = ["cairosvg>=2.7"]
basemap = [
    "pyogrio>=0.9",
]

[project.scripts]
traceart = "traceart.cli.main:main"

[dependency-groups]
# pyogrio et cairosvg sont des extras côté consommateur, mais la suite
# de tests les exerce : sans eux, un `uv sync` nu casse les tests.
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "pyogrio>=0.9",
    "cairosvg>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/traceart"]

[tool.hatch.build.targets.wheel.force-include]
"src/traceart/basemap/osmconf.ini" = "traceart/basemap/osmconf.ini"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
